# Sample Configuration

mail:
  # Gmail label to parse
  label: "foo"
  # Max ID to parse
  maxid: "NO_ID"
  # Time to wait between parsing in minutes
  wait: 15
  # Path to the client secret file
  secret: "client_secret.json"

slack:
  # Slack bot token (starts with xoxb-)
  token: ""
  
  # Slack app-level token (starts with xapp-)
  app_token: ""
  
  # Slack channel ID
  channel: "C05RPHGAA9Y"

gpt:
  # OpenAI or Anthropic API key
  key: ""
  
  # Model to use. A "claude-" prefix routes to Anthropic, anything else to OpenAI
  model: "gpt-3.5-turbo"

  # Optional: "openai" or "anthropic". Inferred from the model name when empty
  provider: ""

  # Optional: cap on the reply length. 0 leaves the provider default
  # (1024 for Anthropic, unset for OpenAI)
  max_tokens: 0

  # Optional tuning knobs. No model accepts both -- the newer models dropped
  # temperature and took effort in its place. Roughly, at time of writing:
  #
  #                        temperature   effort
  #   gpt-3.5 / gpt-4o         yes         no
  #   o-series / gpt-5         no          yes
  #   claude-3.x / haiku-4-5   yes         no
  #   claude-opus-5            no          yes
  #
  # Nothing checks this before sending: the table above would go stale with
  # every provider release. Pick the wrong one and the first query fails with
  # an error naming the knob and pointing back at this block.

  # Optional: sampling temperature. Passed through provider-native and NOT
  # rescaled, so the range differs: 0-2 on OpenAI (1 is its default), 0-1 on
  # Anthropic. Omit the key to leave it unset -- that is different from 0,
  # which is a real value asking for the most deterministic output.
  # temperature: 0.7

  # Optional: reasoning depth on models that support it. One of low, medium,
  # high, xhigh, max. OpenAI stops at high. Omit to leave unset.
  # effort: "medium"

